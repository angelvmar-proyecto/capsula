<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Keygen Manager Pro</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Pantalla de Bloqueo (PIN) -->
  <div id="lock-screen" class="card" style="display:none; margin-top: 50px;">
    <h2>🔒 App Bloqueada</h2>
    <p class="hint">Ingresa tu PIN de seguridad.</p>
    <input type="password" id="pin-input" inputmode="numeric" maxlength="4" placeholder="****" style="text-align:center; font-size:2rem; letter-spacing: 10px;">
    <button id="unlock-btn" class="primary">Desbloquear</button>
  </div>

  <div id="main-app" style="display:none;">
    <header>
      <h1>🔐 Keygen Pro</h1>
      <p class="subtitle">CRM de Licencias</p>
    </header>

    <main>
      <!-- Sección: cargar clave -->
      <section id="key-section" class="card">
        <h2>1. Cargar clave privada</h2>
        <textarea id="key-input" rows="3" placeholder="-----BEGIN PRIVATE KEY-----&#10;...&#10;-----END PRIVATE KEY-----"></textarea>
        <button id="save-key-btn" class="primary">💾 Guardar clave</button>
      </section>

      <!-- Sección: generar licencia -->
      <section id="gen-section" class="card" style="display:none;">
        <h2>2. Nueva Licencia</h2>
        
        <!-- Selector de Tipo de Trial -->
        <div style="display:flex; gap:10px; margin-bottom: 12px; background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155;">
          <select id="trial-type" style="flex: 2; margin-top:0; border:none; background:transparent; color:#38bdf8; font-weight:bold;">
            <option value="3">Trial 3 días</option>
            <option value="7" selected>Trial 7 días</option>
            <option value="14">Trial 14 días</option>
            <option value="30">Trial 30 días</option>
          </select>
          <button type="button" id="trial-btn" class="secondary" style="flex: 1; padding:6px; font-size:0.8rem; margin-top:0;">⚡ Aplicar</button>
        </div>

        <form id="license-form">
          <div style="display:flex; gap:10px;">
            <label style="flex:1;">Aplicación
              <input id="app-name" type="text" required placeholder="ej: TransportLog" />
            </label>
            <label style="flex:1;">Usuario
              <input id="user-id" type="text" required placeholder="ej: Juan Perez" />
            </label>
          </div>
          <label>Notas / Contacto
            <input id="notes" type="text" placeholder="ej: WhatsApp 55-1234-5678" />
          </label>
          <label>Funciones (separadas por coma)
            <input id="features" type="text" placeholder="pro, export" />
          </label>
          <label>Días de validez
            <input id="days" type="number" value="365" min="1" />
          </label>
          <button type="submit" class="primary">🔑 Generar y Guardar</button>
        </form>
      </section>

      <!-- Sección: Base de datos / Registro -->
      <section id="db-section" class="card" style="display:none;">
        <h2>📊 Registro de Licencias</h2>
        
        <div style="display:flex; gap:8px; margin-bottom:10px;">
          <button id="export-btn" class="secondary" style="flex:1; padding:8px; font-size:0.8rem;">📥 Exportar JSON</button>
          <label class="secondary" style="flex:1; text-align:center; padding:8px; font-size:0.8rem; cursor:pointer; margin:0;">
            📤 Importar <input type="file" id="import-input" accept=".json" style="display:none;">
          </label>
        </div>

        <div id="stats-container" class="stats-grid">
          <div class="stat-box"><span id="stat-total">0</span><br>Licencias</div>
          <div class="stat-box"><span id="stat-users">0</span><br>Usuarios</div>
          <div class="stat-box"><span id="stat-apps">0</span><br>Apps</div>
        </div>

        <input type="text" id="search-input" placeholder="🔍 Buscar por usuario, app o nota..." style="margin: 10px 0;">
        <div id="list-container"></div>
        <button id="clear-db-btn" class="danger" style="margin-top: 15px;">🗑️ Borrar todo el registro</button>
      </section>
    </main>
  </div>

  <!-- Modal QR -->
  <div id="qr-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:100; align-items:center; justify-content:center; flex-direction:column;">
    <div style="background:white; padding:20px; border-radius:12px; text-align:center;">
      <div id="qr-canvas-container"></div>
      <button id="close-qr" class="danger" style="margin-top:10px; color:black; border-color:black;">Cerrar</button>
    </div>
  </div>

  <script src="vendor/qrcode.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
