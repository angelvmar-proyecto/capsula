<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Keygen</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🔐 Keygen</h1>
    <p class="subtitle">Generador de licencias</p>
  </header>

  <main>
    <!-- Sección: cargar clave -->
    <section id="key-section" class="card">
      <h2>1. Cargar clave privada</h2>
      <p class="hint">Pega el contenido de <code>private-pkcs8.pem</code>.</p>
      <textarea id="key-input" rows="4" placeholder="-----BEGIN PRIVATE KEY-----&#10;...&#10;-----END PRIVATE KEY-----"></textarea>
      <button id="save-key-btn" class="primary">💾 Guardar clave</button>
      <p id="key-status" class="status"></p>
    </section>

    <!-- Sección: generar licencia -->
    <section id="gen-section" class="card" style="display:none;">
      <h2>2. Generar licencia</h2>
      <form id="license-form">
        <label>
          Aplicación
          <input id="app-name" type="text" required placeholder="ej: MiAppPro" />
        </label>
        <label>
          Nombre / ID del usuario
          <input id="user-id" type="text" required placeholder="ej: Juan Perez" />
        </label>
        <label>
          Funciones (separadas por coma)
          <input id="features" type="text" placeholder="pro, export, premium" />
        </label>
        <label>
          Días de validez
          <input id="days" type="number" value="365" min="1" />
        </label>
        <button type="submit" class="primary">🔑 Generar y Guardar licencia</button>
      </form>

      <div id="result-container" style="display:none; margin-top: 12px;">
        <textarea id="result" rows="5" readonly style="word-break: break-all;"></textarea>
        <button id="copy-btn" class="secondary">📋 Copiar licencia</button>
      </div>
      
      <button id="clear-key-btn" class="danger" style="margin-top: 20px;">🗑️ Olvidar clave privada</button>
    </section>

    <!-- Sección: historial -->
    <section id="history-section" class="card" style="display:none;">
      <h2>📜 Historial de Licencias</h2>
      <div id="history-list"></div>
      <button id="clear-history-btn" class="danger" style="margin-top: 16px;">🗑️ Borrar todo el historial</button>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
