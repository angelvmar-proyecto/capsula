<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Keygen</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🔐 Keygen</h1>
    <p class="subtitle">Generador de licencias</p>
  </header>

  <main>
    <section id="key-section" class="card">
      <h2>1. Cargar clave privada</h2>
      <p class="hint">Pega el contenido de <code>private-pkcs8.pem</code>. Se guardará solo en este dispositivo.</p>
      <textarea id="key-input" rows="6" placeholder="-----BEGIN PRIVATE KEY-----&#10;...&#10;-----END PRIVATE KEY-----"></textarea>
      <button id="save-key-btn" class="primary">💾 Guardar clave</button>
      <p id="key-status" class="status"></p>
    </section>

    <section id="gen-section" class="card" style="display:none;">
      <h2>2. Generar licencia</h2>
      <form id="license-form">
        <label>
          ID de usuario / dispositivo
          <input id="user-id" type="text" required placeholder="ej: user_123 o IMEI" />
        </label>
        <label>
          Funciones (separadas por coma)
          <input id="features" type="text" placeholder="pro, export, premium" />
        </label>
        <label>
          Días de validez
          <input id="days" type="number" value="365" min="1" />
        </label>
        <button type="submit" class="primary">🔑 Generar licencia</button>
      </form>

      <textarea id="result" rows="6" readonly style="display:none;"></textarea>
      <button id="copy-btn" class="secondary" style="display:none;">📋 Copiar</button>
      <button id="clear-key-btn" class="danger">🗑️ Olvidar clave</button>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
